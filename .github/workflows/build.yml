name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default; only the release job may write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Ingest.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.Ingest.sln --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution Jellyfin.Plugin.Ingest.sln --configuration Release --no-build 2>&1 | tee test-output.log

      - name: Annotate failed tests
        if: failure()
        shell: python
        run: |
          # Surface the end of the test output as an annotation (readable on the PR without opening logs)
          tail = open("test-output.log", encoding="utf-8", errors="replace").read().splitlines()[-60:]
          body = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail)
          print(f"::error title=dotnet test failed (last lines of output)::{body}")

      - name: Package
        run: |
          mkdir -p artifacts
          cp src/Jellyfin.Plugin.Ingest/bin/Release/net10.0/Jellyfin.Plugin.Ingest.dll artifacts/
          (cd artifacts && zip -q ../jellyfin-plugin-ingest.zip Jellyfin.Plugin.Ingest.dll)

      - uses: actions/upload-artifact@v7
        with:
          name: jellyfin-plugin-ingest
          path: jellyfin-plugin-ingest.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jellyfin-plugin-ingest

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jellyfin-plugin-ingest.zip --repo "$GITHUB_REPOSITORY" --generate-notes
