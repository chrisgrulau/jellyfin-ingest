# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Shoal Ingest"
guid: "88d6ced9-052e-45f6-b21d-fc4eefa7998d"
version: "0.1.8.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Watch drop folders and file new media into your libraries, correctly named."
description: >
  Watches one or more drop folders. New media is identified from its release name and the server's own metadata
  providers, renamed to Jellyfin's naming standard (with provider IDs) and moved, with its subtitles, into the
  destination library for its kind. Release clutter is quarantined and purged after a retention period. Anything
  that can't be identified confidently waits on the plugin page for a decision.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Ingest.dll"
changelog: >
  0.1.8-alpha: review fixes. Libraries on a whole drive can be filed into; Jellyfin's metadata and transcode folders
  are protected; folder links and unreadable releases are handled. Quarantine never touches date folders Ingest didn't
  create, and "Quarantine release" is crash-safe and logged. Recovery only touches Ingest's own temporary files, a
  full disk after a move no longer splits a release, a hung network share can't stall filing, and choices on the
  review screen are checked against what the page showed.
