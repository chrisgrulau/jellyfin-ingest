# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Ingest"
guid: "88d6ced9-052e-45f6-b21d-fc4eefa7998d"
version: "0.1.4.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Watch drop folders and file new media into your libraries, correctly named."
description: >
  Watches one or more drop folders. New media is identified from its release name and the server's own metadata
  providers, renamed to Jellyfin's naming standard (with provider IDs) and moved, with its subtitles, into the
  destination library for its kind. Release clutter is quarantined and purged after a retention period. Anything
  that can't be identified confidently waits on the plugin page for a decision.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Ingest.dll"
changelog: >
  0.1.4-alpha: safety release. Symbolic links are never followed; provider ids are validated and every move is
  checked to stay inside its library or the quarantine; unsafe watch and quarantine folders are refused, and the purge
  only deletes folders Ingest created; downloads still being written are not mistaken for finished ones; moves are
  crash-safe and all-or-nothing; one unreadable folder no longer stops the others.
