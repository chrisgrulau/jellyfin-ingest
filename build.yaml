version: "0.1.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Watch drop folders and file new media into your libraries, correctly named."
description: >
  Watches one or more drop folders. New media is identified with Jellyfin's own parser and metadata providers,
  renamed to Jellyfin's naming standard (with provider IDs), moved into the target library together with its
  subtitles, and the release clutter is quarantined and purged after a retention period.
